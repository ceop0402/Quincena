<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173B66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Ceop</title>
<style>
:root{
  --bg:#EAEFF5; --surface:#FFFFFF; --sunk:#DDE5EF; --ink:#13253A; --muted:#5A6B7D; --line:#CBD6E3;
  --brand:#173B66; --brand-ink:#FFFFFF; --save:#1F8A63; --loss:#B8750F; --lossbar:#D98E1F; --neg:#B83A30; --warnbg:#F6E7CC;
  --res:#2F7BD8; --lib:#7A5DA8; --fix:#5C7378; --var:#C2563B;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0D1622; --surface:#152233; --sunk:#1C2D42; --ink:#E5ECF4; --muted:#93A5B8; --line:#2A3C53;
  --brand:#1E3F66; --brand-ink:#E4EEEB; --save:#3CC08B; --loss:#F0A947; --lossbar:#F0A947; --neg:#E5675C; --warnbg:#3A2F1A;
  --res:#6FA6D6; --lib:#A88BD6; --fix:#8FA7AC; --var:#E07B5F; color-scheme:dark;}
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand);z-index:10}
main{max-width:560px;margin:0 auto;padding:0 16px 120px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.12rem;margin:26px 0 10px}
h3{font-size:1rem}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--res);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:.85rem} .money{font-weight:650;white-space:nowrap} .neg{color:var(--neg)} .pos{color:var(--save)} .hidden{display:none!important}
.hero{background:var(--brand);color:var(--brand-ink);margin:0 -16px;padding:20px 20px 30px;border-radius:0 0 28px 28px}
.hero .top{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;opacity:.85}
.hero .big{font-size:2.5rem;font-weight:750;letter-spacing:-.02em;margin:8px 0 2px;line-height:1.1}
.hero .sub{opacity:.82;font-size:.92rem}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.kpis div{background:rgba(255,255,255,.09);border-radius:12px;padding:10px}
.kpis b{display:block;font-size:1.05rem}
.kpis span{font-size:.75rem;opacity:.8}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:14px 0 8px;background:rgba(255,255,255,.15)}
.stack span{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.panel{background:var(--surface);border-radius:var(--r-md);padding:14px 16px;margin:10px 0}
.lift{margin-top:-16px;position:relative;border-radius:var(--r-lg)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.flowbars .fb{margin:10px 0}
.flowbars .track{height:14px;background:var(--sunk);border-radius:7px;overflow:hidden;margin-top:5px;display:flex}
.flowbars .track span{display:block;height:100%}
.flow{display:flex;height:32px;border-radius:var(--r-sm);overflow:hidden;margin:10px 0 8px}
.flow .kept{background:var(--save);display:flex;align-items:center;padding-left:10px;color:#fff;font-weight:650;font-size:.88rem;white-space:nowrap;overflow:hidden}
.flow .lost{background:repeating-linear-gradient(-45deg,var(--lossbar),var(--lossbar) 6px,transparent 6px,transparent 10px);border:2px solid var(--lossbar);border-left:0;border-radius:0 var(--r-sm) var(--r-sm) 0}
.qtabs{display:flex;gap:6px;margin-bottom:10px}
.qtabs button,.seg button{flex:1;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 0;font-size:.86rem}
.qtabs button[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;gap:6px;margin:16px 0 4px;overflow-x:auto}
.seg button{padding:8px 12px;white-space:nowrap}
.goal{margin:6px 0 16px}
.goal:last-child{margin-bottom:4px}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;border-radius:4px}
.lines{margin:0;padding:0;list-style:none}
.lines li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.lines li:last-child{border-bottom:0}
.lines li.total{font-weight:700}
.lines li.sub{font-size:.85rem;color:var(--muted);padding:3px 0 3px 12px;border:0}
details{flex:1}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.monthbar{display:flex;align-items:center;justify-content:space-between;background:var(--brand);color:var(--brand-ink);margin:0 -16px;padding:14px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.monthbar button{background:rgba(255,255,255,.12);border:0;color:inherit;width:42px;height:42px;border-radius:50%;font-size:1.2rem}
.monthbar h1{font-size:1.2rem}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.field label{font-size:.82rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
input,select{width:100%;background:var(--sunk);border:1px solid transparent;border-radius:var(--r-sm);padding:11px 12px;font-size:16px}
input:focus,select:focus{border-color:var(--res);outline:none}
.mov{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.mov:last-child{border-bottom:0}
.dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}
.dot.out{background:color-mix(in srgb,var(--neg) 16%,transparent);color:var(--neg)}
.dot.in{background:color-mix(in srgb,var(--save) 18%,transparent);color:var(--save)}
.dot.tr{background:color-mix(in srgb,var(--res) 18%,transparent);color:var(--res)}
.mov .txt{flex:1;min-width:0}
.mov .txt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:none;border:0;color:var(--muted);min-width:44px;min-height:44px;font-size:1.05rem;border-radius:50%}
.empty{color:var(--muted);text-align:center;padding:16px 8px;font-size:.92rem}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:.84rem;min-width:100%}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
thead th{font-weight:600;color:var(--muted)}
td.est{color:var(--muted);font-style:italic}
.btn{border:0;border-radius:var(--r-sm);padding:12px 16px;font-weight:600;background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:transparent;color:var(--neg);border:1px solid var(--neg)}
.btn.full{width:100%;display:block;text-align:center}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--save);color:#fff;font-size:1.9rem;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:8}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 13px;font-size:.88rem;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:8px;margin:6px 0 4px;flex-wrap:wrap}
.chips.scrollx{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
nav div{display:flex;max-width:560px;width:100%}
nav button{flex:1;background:none;border:0;padding:10px 0 12px;font-size:.74rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{color:var(--ink);font-weight:650}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet .head button{background:var(--sunk);border:0;border-radius:50%;width:36px;height:36px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:14px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:40;max-width:90vw;text-align:center}
.warn{background:var(--warnbg);border-radius:var(--r-md);padding:12px 14px;margin:12px 0;font-size:.9rem}
.alert-neg{color:var(--neg);font-weight:650}
.gasto{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.gasto:last-child{border-bottom:0}
.gasto .txt{flex:1;min-width:0}
.gasto.off .txt{opacity:.5}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:14px;transition:.15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked+span{background:var(--save)}
.switch input:checked+span::after{left:21px}
svg.chart{width:100%;height:auto;display:block}
.preview{font-size:.9rem;color:var(--muted);margin:2px 0 6px;min-height:1.3em}
.preview b{color:var(--ink)}
/* lock */
.lock{position:fixed;inset:0;background:var(--brand);color:var(--brand-ink);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
.pins{display:flex;gap:14px}
.pins i{width:14px;height:14px;border-radius:50%;border:2px solid var(--brand-ink);display:block}
.pins i.on{background:var(--brand-ink)}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:14px}
.pad button{height:74px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:inherit;font-size:1.6rem}
.pad button.txt{background:none;font-size:.9rem}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.toast button{background:none;border:0;color:var(--save);font-weight:700;padding:4px 2px;filter:brightness(1.4)}
.left{background:var(--brand);color:var(--brand-ink);margin:0 -16px;padding:18px 20px 30px;border-radius:0 0 28px 28px}
.left .lab{font-size:.95rem;opacity:.85}
.left .big{font-size:3rem;font-weight:780;letter-spacing:-.03em;line-height:1.05;margin:6px 0 4px}
.left .big.over{color:#FFB4A8}
.left .meter{height:10px;border-radius:5px;background:rgba(255,255,255,.16);overflow:hidden;margin:14px 0 8px}
.left .meter span{display:block;height:100%;border-radius:5px}
.left .meta{display:flex;justify-content:space-between;font-size:.86rem;opacity:.85}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini div{background:var(--surface);border-radius:var(--r-md);padding:12px 10px}
.mini b{display:block;font-size:1.05rem}
.mini span{font-size:.76rem;color:var(--muted)}
.mini.lift{margin-top:-18px;position:relative}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 6px}
.catgrid button{background:var(--sunk);border:2px solid transparent;border-radius:var(--r-md);padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;line-height:1.15;min-height:70px}
.catgrid button .e{font-size:1.45rem;line-height:1}
.catgrid button[aria-pressed=true]{border-color:var(--ink);background:var(--surface)}
.mov{position:relative;touch-action:pan-y;transition:transform .18s}
.mov.tap{cursor:pointer}
.mov .e{font-size:1.25rem}
.trinfo{margin-top:10px;font-size:.88rem;min-height:2.6em}
.trinfo .row{padding:2px 0}
svg.chart g.col{cursor:pointer}
.datechips{display:flex;gap:8px;align-items:center;margin:8px 0}
.datechips input{flex:1;min-width:0}
.linkbtn{background:none;border:0;color:var(--res);padding:6px 0;font-weight:600}
.brandrow{display:flex;align-items:center;gap:10px;justify-content:flex-start!important}
.brandrow img{width:30px;height:30px;border-radius:8px;background:#fff}
/* calendario */
.cal{background:var(--surface);border-radius:var(--r-lg);padding:12px;margin-top:-16px;position:relative}
.cal .wd,.cal .days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd span{font-size:.72rem;color:var(--muted);padding:4px 0}
.cal .days button{position:relative;aspect-ratio:1/1;border:0;border-radius:12px;font-size:.92rem;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.cal .days button.q1{background:color-mix(in srgb,var(--res) 9%,transparent)}
.cal .days button.q2{background:color-mix(in srgb,var(--save) 10%,transparent)}
.cal .days button.qsel.q1{background:color-mix(in srgb,var(--res) 22%,transparent)}
.cal .days button.qsel.q2{background:color-mix(in srgb,var(--save) 24%,transparent)}
.cal .days button.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal .days button[aria-pressed=true]{background:var(--ink)!important;color:var(--bg)}
.cal .days button.pay::after{content:"💰";position:absolute;top:-3px;right:-2px;font-size:.7rem}
.cal .dots{display:flex;gap:2px;height:5px}
.cal .dots i{width:5px;height:5px;border-radius:50%;display:block}
.cal .qsw{display:flex;gap:6px;margin-top:10px}
.cal .qsw button{flex:1;border:1px solid var(--line);background:transparent;border-radius:12px;padding:8px 6px;font-size:.84rem;text-align:left;line-height:1.25}
.cal .qsw button b{display:block;font-size:.95rem}
.cal .qsw button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.monthbar h1 button{background:none;border:0;color:inherit;font:inherit;font-size:1.1rem;padding:6px 10px;border-radius:10px;white-space:nowrap}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
.mgrid button{border:1px solid var(--line);background:transparent;border-radius:12px;padding:12px 4px;font-size:.92rem}
.mgrid button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mgrid button.now{box-shadow:inset 0 0 0 2px var(--save)}
/* proyección */
.whatif input[type=range]{width:100%;accent-color:var(--ink);padding:0;background:none}
.ms{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ms:last-child{border-bottom:0}
.ms .when{width:74px;flex:none;font-weight:700;font-size:.86rem;white-space:nowrap}
.ms .what{flex:1}
.ms .what small{display:block;color:var(--muted)}
.mrow summary{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:10px}
.mrow summary .sp{flex:1;margin:0 10px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex}
.mrow summary .sp span{display:block;height:100%}
.mrow[open] summary{border-bottom:0}
.mrow .lines{padding:0 0 8px;border-bottom:1px solid var(--line)}
/* ajustes */
.menu{background:var(--surface);border-radius:var(--r-md);margin:10px 0;overflow:hidden}
.menu button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px;text-align:left;min-height:54px}
.menu button:last-child{border-bottom:0}
.menu .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--sunk);flex:none;font-size:1rem}
.menu .t{flex:1;min-width:0}
.menu .t b{display:block;font-weight:600;font-size:.95rem}
.menu .t span{display:block;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu .chev{color:var(--muted)}
.gasto .icon-btn.del{color:var(--neg)}
.qcal{background:var(--sunk);border-radius:var(--r-md);padding:10px;margin:10px 0 4px}
.qcal .qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.qcal .qhead button{background:var(--surface);border:0;border-radius:50%;width:38px;height:38px;font-size:1.1rem}
.qcal .qhead b{font-size:.92rem;text-align:center;flex:1}
.qcal .qhead small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.qcal .wd,.qcal .qd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.qcal .wd span{font-size:.7rem;color:var(--muted);padding:2px 0}
.qcal .qd button{height:40px;border:0;border-radius:10px;background:var(--surface);font-size:.92rem}
.qcal .qd button.today{box-shadow:inset 0 0 0 2px var(--save)}
.qcal .qd button.fut{opacity:.55}
.qcal .qd button[aria-pressed=true]{background:var(--ink);color:var(--bg);opacity:1}
.qcal .hoy{background:none;border:0;color:var(--res);font-weight:600;font-size:.85rem;padding:6px 0 0}
</style>

<script>
"use strict";
/* ================= estado ================= */
const KEY="quincena.v1";
const DEFAULT={
  version:2,
  config:{inicio:"",meses:14,sueldoBase:0,iva:0,aguinaldo:0,aguinaldoFecha:"",tasaBcvIni:0,tasaCompraIni:0,comisionPM:0.003,
    capBinance:0,capKontigo:0,capFacebank:0,mesesReserva:3,pctCapReserva:0.3,pctReserva:0.2,presupuestoVar:0,mesesPromedio:3,pinHash:""},
  gastos:[],metas:[],topes:{},quincenas:{},movs:[],lastBackup:null
};
const CATS_OUT=["Comida","Salud","Transporte","Hogar","Familia","Sasha","Ocio","Ropa","Regalos","Imprevistos","Otros"];
const CATS_IN=["Venta de perfumes","Trabajo freelance","Bono","Reembolso","Regalo","Rendimiento","Otro"];
const EMO={"Comida":"🍔","Salud":"💊","Transporte":"🚌","Hogar":"🏠","Familia":"👪","Sasha":"🐶","Ocio":"🎮","Ropa":"👕","Regalos":"🎁","Imprevistos":"⚠️","Otros":"📦","Venta de perfumes":"🧴","Trabajo freelance":"💻","Bono":"⭐","Reembolso":"↩️","Regalo":"🎁","Rendimiento":"📈","Otro":"💵","Transferencia":"⇄"};
const CUENTAS=["Binance","Kontigo","Facebank","Bs (banco)"];
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESESL=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const GCOL=["#1F8A63","#C2853B","#8B5BB5","#2E8FA3","#B5527A","#6E8B2E"];
function load(){
  try{const raw=localStorage.getItem(KEY); if(raw)return merge(JSON.parse(raw));}catch(e){}
  const d=structuredClone(DEFAULT); d.config.inicio=todayStr().slice(0,7); return d;
}
function merge(d){
  const o=structuredClone(DEFAULT); Object.assign(o,d); o.config=Object.assign(structuredClone(DEFAULT.config),d.config||{});

function quincenas(){
  const c=S.config; const [y0,m0]=(c.inicio||todayStr().slice(0,7)).split("-").map(Number);
  const t=todayStr(); const [ty,tm]=t.split("-").map(Number); const need=(ty-y0)*12+(tm-m0)+13;
  const n=Math.max(1,c.meses|0,need); const out=[];
  for(let i=0;i<n;i++){
    const y=y0+Math.floor((m0-1+i)/12), m=(m0-1+i)%12+1, ld=lastDay(y,m);
    out.push({key:`${y}-${pad(m)}-1`,y,m,q:1,desde:`${y}-${pad(m)}-01`,hasta:`${y}-${pad(m)}-15`,cobroDef:`${y}-${pad(m)}-15`});
    out.push({key:`${y}-${pad(m)}-2`,y,m,q:2,desde:`${y}-${pad(m)}-16`,hasta:`${y}-${pad(m)}-${pad(ld)}`,cobroDef:`${y}-${pad(m)}-${pad(ld)}`});
  }
  let prevH=null;
  for(const q of out){const c=(S.quincenas[q.key]||{}).cobro; q.cobro=(c&&(!prevH||c>prevH))?c:q.cobroDef; if(prevH&&q.cobro<=prevH)q.cobro=q.cobroDef;
    q.hasta=q.cobro; q.desde=prevH?addDay(prevH):q.desde; prevH=q.hasta; q.cobroMov=q.cobro!==q.cobroDef;}
  return out;
}
const fijosMensuales=()=>S.gastos.filter(g=>g.tipo==="Fijo"&&g.activo).reduce((a,g)=>a+(+g.monto||0),0);
const metaReserva=()=>(+S.config.mesesReserva||0)*fijosMensuales();
function compute(opt={}){
  const c=S.config, qs=quincenas(), today=todayStr(), metaR=metaReserva();
  // tasas (arrastre)
  let pB=+c.tasaBcvIni||0, pP=+c.tasaCompraIni||0;
  for(const q of qs){const d=S.quincenas[q.key]||{}; q.bcv=+d.bcv>0?+d.bcv:pB; q.buy=+d.compra>0?+d.compra:pP; pB=q.bcv; pP=q.buy; q.d=d; q.tasaCargada=+d.bcv>0||+d.compra>0;}
  const pmR=+c.comisionPM||0, pmF=x=>(x.clase==="salida"&&x.pm&&x.moneda!=="USDT")?1+pmR:1;
  const toBcv=(x,q)=>(x.moneda==="Bs"?(q.bcv>0?(+x.monto||0)/q.bcv:0):x.moneda==="$"?(+x.monto||0):0)*pmF(x);
  const toUs=x=>x.moneda==="USDT"?(+x.monto||0):0;
  const eqUsd=(x,q)=>x.moneda==="USDT"?(+x.monto||0):toBcv(x,q);
  for(const q of qs){q.ms=S.movs.filter(x=>x.fecha>=q.desde&&x.fecha<=q.hasta); q.salTot=q.ms.filter(x=>x.clase==="salida").reduce((a,x)=>a+eqUsd(x,q),0);}
  // promedio de gasto variable: meses completos anteriores al actual con registros
  const curM=today.slice(0,7); const pm={};
  for(const q of qs){const k=`${q.y}-${pad(q.m)}`; if(k<curM){pm[k]=pm[k]||{s:0,n:0}; pm[k].s+=q.salTot; pm[k].n+=q.ms.filter(x=>x.clase==="salida").length;}}
  const hist=Object.entries(pm).filter(([k,v])=>v.n>0).sort().slice(-(Math.max(1,c.mesesPromedio|0)));
  const avgReal=hist.length?hist.reduce((a,[k,v])=>a+v.s,0)/hist.length:null;
  const budget=+c.presupuestoVar||0;
  const avgMonth=(budget>0?budget:(avgReal||0))+(+opt.extraVar||0);
  const avgSource=budget>0?"tu presupuesto":(avgReal!=null?`tu promedio de ${hist.length} ${hist.length===1?"mes":"meses"}`:"sin presupuesto");
  // metas
  const G=S.metas.map((g,i)=>({...g,col:GCOL[i%GCOL.length],bal:0,buyDate:g.comprada?(g.fechaCompra||""):(g.fecha||""),bought:false,short:0,eta:null,boughtKey:null,surplus:0}));
  const first=qs[0].desde;
  G.forEach(g=>{if(g.buyDate&&g.buyDate<first)g.bought=true;});
  const fill=rem=>{for(let k=0;k<12&&rem>1e-6;k++){const act=G.filter(g=>!g.bought&&(+g.pct>0)&&g.bal<(+g.precio||0)-1e-6); if(!act.length)break;
      const tp=act.reduce((a,g)=>a+(+g.pct),0); let used=0;
      for(const g of act){const give=Math.min(rem*(+g.pct)/tp,(+g.precio)-g.bal); g.bal+=give; used+=give;} rem-=used; if(used<1e-9)break;} return rem;};
  const capIni=(+c.capBinance||0)+(+c.capKontigo||0)+(+c.capFacebank||0);
  let aR=Math.min(capIni*(+c.pctCapReserva||0),capIni); let aL=fill(capIni-aR);
  const rows=[];
  for(const q of qs){
    const d=q.d, loss=q.buy>0&&q.bcv>0?1-q.bcv/q.buy:0;
    const sueldo=(+c.sueldoBase||0)*(1+(+c.iva||0));
    const agui=(c.aguinaldoFecha&&c.aguinaldoFecha>=q.desde&&c.aguinaldoFecha<=q.hasta)?(+c.aguinaldo||0):0;
    const gList=S.gastos.filter(g=>g.activo&&+g.q===q.q&&(!g.desde||g.desde<=q.hasta)&&(!g.hasta||g.hasta>=q.hasta)).map(g=>({concepto:g.concepto,monto:+g.monto||0,pm:g.pm}));
    G.forEach(g=>{if(g.buyDate&&g.buyDate<=q.hasta&&+g.gastoPost>0)gList.push({concepto:`${g.nombre} (después de comprar)`,monto:(+g.gastoPost)/2,pm:false,post:true});});
    const gastos=gList.reduce((a,g)=>a+g.monto,0), com=gList.filter(g=>g.pm).reduce((a,g)=>a+g.monto,0)*(+c.comisionPM||0);
    const ing=q.ms.filter(x=>x.clase==="ingreso"), sal=q.ms.filter(x=>x.clase==="salida"), tr=q.ms.filter(x=>x.clase==="transferencia");
    const extraBs=ing.reduce((a,x)=>a+toBcv(x,q),0), extraUs=ing.reduce((a,x)=>a+toUs(x),0);
    const salBs=sal.reduce((a,x)=>a+toBcv(x,q),0), salUs=sal.reduce((a,x)=>a+toUs(x),0);
    const comMov=sal.reduce((a,x)=>a+(pmF(x)>1?toBcv(x,q)-toBcv(x,q)/pmF(x):0),0);
    const fees=tr.reduce((a,x)=>a+Math.max(0,(+x.monto||0)-(+x.recibido||0)),0);
    const varEst=q.hasta>=today?Math.max(0,Math.max(0,avgMonth)/2-q.salTot):0;
    const sob=sueldo+agui+extraBs-gastos-com-salBs-varEst;
    const convEst=sob*(1-loss), real=!!+d.usdtReal, conv=real?+d.usdtReal:convEst, lossUsd=sob>0?sob-conv:0;
    const neto=conv-salUs+extraUs-fees;
    let apR=0,apG=0,apL=0;
    if(neto>=0){const gR=Math.max(0,metaR-aR); apR=Math.min(neto*(+c.pctReserva||0),gR); let rem=neto-apR; const before=G.reduce((a,g)=>a+g.bal,0); rem=fill(rem); apG=G.reduce((a,g)=>a+g.bal,0)-before; const x=Math.min(rem,Math.max(0,metaR-aR-apR)); apR+=x; rem-=x; apL=rem; aR+=apR; aL+=apL;}
    else{let def=-neto; const fromL=Math.min(aL,def); aL-=fromL; def-=fromL; aR-=def; apL=-fromL; apR=-def;}
    const buys=[];
    G.forEach(g=>{
      if(!g.bought&&g.eta==null&&g.bal>=(+g.precio)-0.01&&+g.precio>0)g.eta=q.key;
      if(!g.bought&&g.buyDate&&g.buyDate>=q.desde&&g.buyDate<=q.hasta){
        const cost=+g.precio||0, pay=Math.min(g.bal,cost); g.bal-=pay; let short=cost-pay;
        const fl=Math.min(aL,short); aL-=fl; short-=fl; aR-=short; g.short=short+fl; g.fromLib=fl; g.fromRes=short;
        aL+=g.bal; g.surplus=g.bal; g.bal=0; g.bought=true; g.boughtKey=q.key; buys.push({nombre:g.nombre,precio:cost,falta:cost-pay,fromRes:short});
      }});
    const snap={}; G.forEach(g=>snap[g.id]=g.bal);
    const gSum=G.reduce((a,g)=>a+g.bal,0);
    rows.push({...q,comMov,loss,sueldo,agui,gList,gastos,com,extraBs,extraUs,salBs,salUs,fees,varEst,sob,convEst,conv,real,lossUsd,neto,apR,apG,apL,aR,aL,gSum,snap,buys,tot:aR+aL+gSum,capReal:+d.capitalReal||0});
  }
  // meses
  const months=[];
  for(let i=0;i<rows.length;i+=2){const a=rows[i],b=rows[i+1]; const cat={},tipo={};
    for(const q of [a,b]) for(const x of q.ms){const v=eqUsd(x,q); if(x.clase==="salida")cat[x.categoria]=(cat[x.categoria]||0)+v; else if(x.clase==="ingreso")tipo[x.categoria]=(tipo[x.categoria]||0)+v;}
    const s=k=>a[k]+b[k];
    months.push({y:a.y,m:a.m,key:`${a.y}-${pad(a.m)}`,sueldo:s("sueldo")+s("agui"),extra:s("extraBs")+s("extraUs"),ing:s("sueldo")+s("agui")+s("extraBs")+s("extraUs"),
      fijos:s("gastos")+s("com"),varReal:s("salBs")+s("salUs"),varEst:s("varEst"),fees:s("fees"),loss:s("lossUsd"),neto:s("neto"),aR:b.aR,aL:b.aL,gSum:b.gSum,snap:b.snap,tot:b.tot,
      capReal:b.capReal||a.capReal,cat,tipo,buys:[...a.buys,...b.buys],future:a.desde>today,current:a.desde.slice(0,7)===curM});}
  return {rows,months,metaR,G,avgMonth,avgSource,capIni,avgReal,budget,histN:hist.length};
}

function trendChart(ms,mi){
  const from=Math.max(0,mi-3), sl=ms.slice(from,from+8); if(!sl.length)return"";
  const W=520,H=210,P={l:40,r:8,t:10,b:28}; const max=Math.max(...sl.map(m=>Math.max(m.ing,m.fijos+m.varReal+m.varEst+m.loss)),1)*1.1;
  const bw=(W-P.l-P.r)/sl.length, y=v=>H-P.b-(H-P.t-P.b)*(v/max), h=v=>(H-P.t-P.b)*(Math.max(0,v)/max);
  const ticks=[0,.5,1].map(f=>max*f);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos por mes">
  ${ticks.map(t=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${P.l-6}" y="${y(t)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${t>=1000?nf.format(t/1000).replace(/,0+$/,"")+"k":nf0.format(t)}</text>`).join("")}
  ${sl.map((m,i)=>{const x0=P.l+i*bw+bw*.14, w=bw*.34; const g1=m.fijos, g2=m.varReal, g3=m.varEst, g4=m.loss; let yy=H-P.b; const seg=(v,col,op)=>{const hh=h(v); yy-=hh; return hh>0?`<rect x="${x0+w+2}" y="${yy}" width="${w}" height="${hh}" fill="${col}" ${op?'opacity=".45"':""}/>`:"";};
    const isCur=from+i===mi;
    return `<g class="col" data-ti="${from+i}"><rect x="${P.l+i*bw}" y="${P.t}" width="${bw}" height="${H-P.t}" fill="transparent"/><rect x="${x0}" y="${y(m.ing)}" width="${w}" height="${h(m.ing)}" fill="var(--save)" ${m.future?'opacity=".45"':""}/>${seg(g1,"var(--fix)",m.future)}${seg(g2,"var(--var)",m.future)}${seg(g3,"var(--var)",1)}${seg(g4,"var(--lossbar)",m.future)}
    <text x="${x0+w+1}" y="${H-9}" font-size="11" text-anchor="middle" fill="${isCur?"var(--ink)":"var(--muted)"}" ${isCur?'font-weight="700"':""}>${MESES[m.m-1]}</text></g>`;}).join("")}
  </svg><div class="legend small" style="margin-top:6px"><span><i style="background:var(--save)"></i>Ingresos</span><span><i style="background:var(--fix)"></i>Fijos</span><span><i style="background:var(--var)"></i>Variables</span><span><i style="background:var(--lossbar)"></i>Cambio</span><span class="muted">Tenue = proyectado</span></div><div class="trinfo" id="trinfo">${trInfo(ms[mi])}</div>`;
}

let whatIf=0, projSel=null;
function milestones(R){
  const out=[]; const lab=k=>{const [y,m,q]=k.split("-");return {k,txt:`${q==="1"?"15":lastDay(+y,+m)} ${MESES[+m-1]}-${y.slice(2)}`};};
  const r=R.rows.find(x=>x.aR>=R.metaR-0.01); if(r&&R.metaR>0)out.push({...lab(r.key),ic:"🛡️",t:"Reserva completa",s:`${$m(R.metaR,false)} = ${S.config.mesesReserva} meses de gastos fijos`});
  R.G.forEach(g=>{if(g.eta)out.push({...lab(g.eta),ic:"🎯",t:`${g.nombre}: meta completa`,s:`${$m(g.precio,false)} ahorrados`});
    if(g.boughtKey&&!S.metas.find(m=>m.id===g.id).comprada)out.push({...lab(g.boughtKey),ic:"🛒",t:`Compras ${g.nombre}`,s:g.short>0.01?`Faltarán ${$m(g.short,false)}${g.fromRes>0.01?", tomados de la reserva":""}`:"Te alcanza"});});
  const fl=R.rows.find(x=>x.aL>1); if(fl)out.push({...lab(fl.key),ic:"✨",t:"Empiezas a acumular capital libre",s:"Reserva y metas activas completas"});
  return out.sort((a,b)=>a.k.localeCompare(b.k));
}
function projChart(R,sel){
  const ms=R.months; const W=520,H=230,P={l:40,r:8,t:12,b:26};
  const max=Math.max(...ms.map(m=>Math.max(m.tot,m.capReal||0)),1)*1.08;
  const x=i=>P.l+(W-P.l-P.r)*(ms.length===1?0:i/(ms.length-1)), y=v=>H-P.b-(H-P.t-P.b)*(Math.max(0,v)/max);
  const area=(lo,hi,col)=>{const top=ms.map((m,i)=>`${x(i).toFixed(1)},${y(hi(m)).toFixed(1)}`).join(" L");const bot=ms.map((m,i)=>`${x(i).toFixed(1)},${y(lo(m)).toFixed(1)}`).reverse().join(" L");return `<path d="M${top} L${bot} Z" fill="${col}" opacity=".85"/>`;};
  const ticks=[0,.5,1].map(f=>max*f); const cur=ms.findIndex(m=>m.current);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Capital proyectado por mes">
  ${ticks.map(t=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${P.l-6}" y="${y(t)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${t>=1000?nf.format(t/1000).replace(/,0+$/,"").replace(/(,\d)\d+/,"$1")+"k":nf0.format(t)}</text>`).join("")}
  ${area(m=>0,m=>Math.max(0,m.aR),"var(--res)")}${area(m=>Math.max(0,m.aR),m=>Math.max(0,m.aR)+m.gSum,"var(--save)")}${area(m=>Math.max(0,m.aR)+m.gSum,m=>Math.max(0,m.aR)+m.gSum+Math.max(0,m.aL),"var(--lib)")}
  ${cur>=0?`<line x1="${x(cur)}" x2="${x(cur)}" y1="${P.t}" y2="${H-P.b}" stroke="var(--ink)" stroke-dasharray="3 4"/><text x="${x(cur)+4}" y="${P.t+10}" font-size="11" fill="var(--ink)">hoy</text>`:""}
  ${sel!=null?`<line x1="${x(sel)}" x2="${x(sel)}" y1="${P.t}" y2="${H-P.b}" stroke="var(--ink)" stroke-width="2"/><circle cx="${x(sel)}" cy="${y(ms[sel].tot)}" r="5" fill="var(--ink)"/>`:""}
  ${ms.map((m,i)=>m.capReal?`<circle cx="${x(i)}" cy="${y(m.capReal)}" r="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>`:"").join("")}
  ${ms.map((m,i)=>i%2===0?`<text x="${x(i)}" y="${H-8}" font-size="11" text-anchor="middle" fill="var(--muted)">${MESES[m.m-1]}</text>`:"").join("")}
  ${ms.map((m,i)=>`<rect data-pi="${i}" x="${x(i)-(W-P.l-P.r)/ms.length/2}" y="0" width="${(W-P.l-P.r)/ms.length}" height="${H}" fill="transparent" style="cursor:pointer"/>`).join("")}
  </svg><div class="legend small" style="margin-top:6px"><span><i style="background:var(--res)"></i>Reserva</span><span><i style="background:var(--save)"></i>Metas</span><span><i style="background:var(--lib)"></i>Libre</span><span class="muted">○ capital real anotado</span></div>`;
}
function vProy(){

  const shift=m=>{if(!msBase)return"";const b=msBase.find(z=>z.t===m.t);if(!b||b.k===m.k)return"";const d=(+m.k.slice(0,4)*24+(+m.k.slice(5,7))*2+(+m.k.slice(8)))-(+b.k.slice(0,4)*24+(+b.k.slice(5,7))*2+(+b.k.slice(8)));return ` <span class="${d>0?"neg":"pos"}" style="font-weight:600">(${d>0?"+":"−"}${Math.abs(d)} ${Math.abs(d)===1?"quincena":"quincenas"})</span>`;};

  <div class="big">${$m(last.tot,false)}</div><div class="sub">${whatIf?`Con ${whatIf>0?"$"+whatIf+" más":"$"+(-whatIf)+" menos"} de gasto variable al mes · sin cambio: ${$m(base.months.at(-1).tot,false)}`:`Con gasto variable de ${$m(R.avgMonth,false)}/mes (${R.avgSource})`}</div></div>
  <div class="panel lift">${projChart(R,projSel)}

   <div class="row small"><span class="muted">Reserva ${$m(P.aR,false)} · Metas ${$m(P.gSum,false)} · Libre ${$m(P.aL,false)}</span></div></div></div>
  <h2>¿Y si gasto más o menos?</h2>
  <div class="panel whatif"><div class="row"><span>Cambio en tu gasto variable mensual</span><b class="money ${whatIf>0?"neg":whatIf<0?"pos":""}">${whatIf>0?"+":whatIf<0?"−":""}$${Math.abs(whatIf)}</b></div>
   <input type="range" id="wi" min="-200" max="300" step="10" value="${whatIf}" aria-label="Cambio en gasto variable mensual">
   <div class="row small muted"><span>−$200</span><span>${whatIf?`<button class="linkbtn" id="wiReset">Volver a mi plan</button>`:"Mueve la barra"}</span><span>+$300</span></div></div>
  <h2>Lo que viene</h2>
  <div class="panel">${ms.length?ms.map(m=>`<div class="ms"><div class="when">${m.txt}</div><div class="what">${m.ic} ${esc(m.t)}${shift(m)}<small>${m.s}</small></div></div>`).join(""):`<div class="empty">Agrega metas para ver aquí cuándo las alcanzas.</div>`}</div>
  <h2>Mes a mes</h2>
  <div class="panel">${R.months.map(m=>`<details class="mrow"><summary><span style="width:74px;white-space:nowrap">${fmtM(m.y,m.m)}${m.buys.length?" 🛒":""}</span><span class="sp"><span style="width:${m.fijos/mx*100}%;background:var(--fix)"></span><span style="width:${(m.varReal+m.varEst)/mx*100}%;background:var(--var)"></span><span style="width:${m.loss/mx*100}%;background:var(--lossbar)"></span><span style="width:${Math.max(0,m.neto)/mx*100}%;background:var(--save)"></span></span><b class="money">${$m(m.tot,false)}</b></summary>
   <ul class="lines"><li class="sub"><span>Ingresos</span><span>${$m(m.ing,false)}</span></li><li class="sub"><span>Gastos fijos</span><span>${$m(m.fijos,false)}</span></li><li class="sub"><span>Gastos variables${m.varEst>0?" (incluye estimado)":""}</span><span>${$m(m.varReal+m.varEst,false)}</span></li><li class="sub"><span>Pérdida por cambio</span><span>${$m(m.loss,false)}</span></li><li class="sub"><span>Ahorro neto</span><span>${$m(m.neto,false)}</span></li><li class="sub"><span>Reserva · Metas · Libre</span><span>${$m(m.aR,false)} · ${$m(m.gSum,false)} · ${$m(m.aL,false)}</span></li>${m.capReal?`<li class="sub"><span>Capital real anotado</span><span>${$m(m.capReal,false)}</span></li>`:""}</ul></details>`).join("")}
   <div class="legend small" style="margin-top:8px"><span><i style="background:var(--fix)"></i>Fijos</span><span><i style="background:var(--var)"></i>Variables</span><span><i style="background:var(--lossbar)"></i>Cambio</span><span><i style="background:var(--save)"></i>Ahorro</span></div></div>
  <h2>En todo el período</h2>
  <div class="panel"><div class="row"><span>Pérdida por cambio</span><span class="money" style="color:var(--loss)">${$m(tl,false)}</span></div></div>
  <h2>Salidas por categoría</h2><div class="panel">${list(cats)}</div>
  <h2>Ingresos extra por tipo</h2><div class="panel">${list(tipos)}</div>`;
}

function frecuentes(clase){const seen=new Set(),out=[];for(const x of [...S.movs].reverse()){if(x.clase!==clase)continue;const k=[x.concepto,x.categoria,x.moneda,x.monto,!!x.pm].join("|");if(seen.has(k))continue;seen.add(k);out.push(x);if(out.length>=6)break;}return out;}
function defaultFecha(){if(view!=="mes")return todayStr();if(selDay)return selDay;const t=todayStr();if(selQ){const R=compute();const r=R.rows.find(r=>r.key===selQ);if(r&&!(t>=r.desde&&t<=r.hasta))return r.desde;}return t;}

async function hash(p){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("quincena:"+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
function pinPad(title,onDone,opts={}){
  document.getElementById("lock")?.remove(); let v="";
  const el=document.createElement("div");el.className="lock";el.id="lock";
  el.innerHTML=`<h2 style="margin:0">${title}</h2><div class="pins">${"<i></i>".repeat(4)}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join("")}<button class="txt" data-x="${opts.cancel?"cancel":"forgot"}">${opts.cancel?"Cancelar":"Olvidé el PIN"}</button><button data-n="0">0</button><button class="txt" data-x="del">Borrar</button></div>`;
  document.body.appendChild(el);
  const dots=()=>el.querySelectorAll(".pins i").forEach((d,i)=>d.classList.toggle("on",i<v.length));
  el.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.n!=null&&v.length<4){v+=b.dataset.n;dots();if(v.length===4){const ok=await onDone(v);if(ok===false){el.querySelector(".pins").classList.add("shake");setTimeout(()=>{el.querySelector(".pins").classList.remove("shake");v="";dots();},350);}else el.remove();}}
    if(b.dataset.x==="del"){v=v.slice(0,-1);dots();}
    if(b.dataset.x==="cancel")el.remove();
    if(b.dataset.x==="forgot"){el.style.display="none";askConfirm("Olvidé el PIN","Sin el PIN solo puedes borrar todos los datos de este teléfono y luego importar un respaldo.","Borrar todo",()=>{localStorage.removeItem(KEY);S=load();locked=false;el.remove();render();toast("Datos borrados. Importa tu respaldo.");});document.getElementById("scrim").addEventListener("click",e=>{if(e.target.closest("[data-close]")||e.target.id==="scrim")el.style.display="";});}
  });
}
const SESS="ceop.activo", SESS_MIN=5;
function touchSess(){try{sessionStorage.setItem(SESS,String(Date.now()));}catch(e){}}
function sessOk(){try{const t=+sessionStorage.getItem(SESS);return t&&Date.now()-t<SESS_MIN*60000;}catch(e){return false;}}
function askPin(force){if(!S.config.pinHash||locked)return;if(!force&&sessOk()){touchSess();return;}locked=true;pinPad("Escribe tu PIN",async p=>{if(await hash(p)===S.config.pinHash){locked=false;touchSess();return true;}return false;});}
window.addEventListener("pagehide",()=>{if(!locked)touchSess();});
setInterval(()=>{if(!locked&&!document.hidden)touchSess();},30000);
function setPin(){pinPad("Nuevo PIN",async p1=>{setTimeout(()=>pinPad("Repite el PIN",async p2=>{if(p1!==p2){toast("Los PIN no coinciden");return true;}S.config.pinHash=await hash(p1);save();touchSess();render();toast("PIN guardado");return true;},{cancel:true}),50);return true;},{cancel:true});}
let hiddenAt=0;
document.addEventListener("visibilitychange",()=>{if(document.hidden){hiddenAt=Date.now();if(!locked)touchSess();}else if(S.config.pinHash&&hiddenAt&&Date.now()-hiddenAt>SESS_MIN*60000)askPin(true);});

async function exportJSON(){
  S.lastBackup=new Date().toISOString(); save();
  const name=`ceop-respaldo-${todayStr()}.json`, blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}), file=new File([blob],name,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:"Respaldo Ceop"});toast("Respaldo listo");render();return;}catch(e){if(e.name==="AbortError"){render();return;}}}

function importJSON(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!d.config||!Array.isArray(d.gastos))throw 0;
  const go=()=>{S=merge(d);save();homeQ=null;curMonth=null;view="inicio";render();toast("Respaldo importado");};
  if(S.gastos.length||S.movs.length)askConfirm("Importar respaldo","Esto reemplaza todos los datos del teléfono por los del respaldo, incluidos los movimientos que registraste.","Reemplazar mis datos",go); else go();}catch(e){toast("Ese archivo no es un respaldo válido de Ceop");}};r.readAsText(f);}
function exportCSV(){
  const R=compute(); const rows=[["Fecha","Tipo","Categoría","Concepto","Moneda","Monto","Equivalente $","Desde","Hacia","Llegó"]];
  for(const q of R.rows) for(const x of q.ms){const eq=x.moneda==="Bs"?(q.bcv>0?x.monto/q.bcv:0):+x.monto;
    rows.push([x.fecha,{salida:"Salida",ingreso:"Ingreso extra",transferencia:"Entre cuentas"}[x.clase],x.categoria,x.concepto,x.moneda,String(x.monto).replace(".",","),eq.toFixed(2).replace(".",","),x.de||"",x.a||"",x.recibido?String(x.recibido).replace(".",","):""]);}
  const csv="\ufeff"+rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`ceop-movimientos-${todayStr()}.csv`;document.body.appendChild(a);a.click();a.remove();toast("Movimientos exportados");

  on("[data-mnew]",b=>b.onclick=()=>metaSheet());
  on("[data-act]",i=>i.onchange=()=>{S.gastos.find(x=>x.id===i.dataset.act).activo=i.checked;save();render();});
  on("[data-tope]",i=>i.addEventListener("change",()=>{const v=numIn(i.value);if(v>0)S.topes[i.dataset.tope]=v;else delete S.topes[i.dataset.tope];save();toast("Guardado");}));
  on("[data-c]",i=>i.addEventListener("change",()=>{const k=i.dataset.c,t=i.dataset.t;let v=i.value;if(t==="n")v=numIn(v);else if(t==="i")v=Math.max(1,Math.round(numIn(v)));else if(t==="p")v=numIn(v)/100;S.config[k]=v;save();toast("Guardado");}));
  const g=id=>document.getElementById(id);
  if(g("exp"))g("exp").onclick=exportJSON; if(g("csv"))g("csv").onclick=exportCSV;
  ["imp","impW"].forEach(id=>{if(g(id))g(id).onchange=()=>importJSON(g(id).files[0]);});
  if(g("pinSet"))g("pinSet").onclick=setPin;
  if(g("pinOff"))g("pinOff").onclick=()=>pinPad("PIN actual",async p=>{if(await hash(p)!==S.config.pinHash)return false;S.config.pinHash="";save();render();toast("PIN quitado");return true;},{cancel:true});
  if(g("wipe"))g("wipe").onclick=()=>askConfirm("Borrar todos los datos","Se borra todo lo guardado en este teléfono. No se puede deshacer, así que exporta un respaldo antes.","Borrar todo",()=>{localStorage.removeItem(KEY);S=load();homeQ=null;curMonth=null;view="inicio";render();toast("Datos borrados");});
}
render(); askPin();
(function(){let x0=null,y0=0,t0=0;const app=document.getElementById("app");
 app.addEventListener("touchstart",e=>{if(view!=="mes"||e.target.closest(".mov,.scroll,input,select,.sheet,.days"))return;x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now();},{passive:true});
 app.addEventListener("touchend",e=>{if(x0==null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;if(Math.abs(dx)>70&&Math.abs(dy)<45&&Date.now()-t0<600){curMonth+=dx<0?1:-1;selQ=null;render();buzz();}},{passive:true});})();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
